<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="crate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Industrial grid lines -->
  <path d="M64 128h384M64 256h384M64 384h384M128 64v384M256 64v384M384 64v384" stroke="rgba(148, 163, 184, 0.08)" stroke-width="2" />

  <!-- Headlight Beams -->
  <path d="M170 140 L120 40 L210 40 Z" fill="url(#beam)" />
  <path d="M342 140 L292 40 L382 40 Z" fill="url(#beam)" />

  <!-- Steel Twin Forks -->
  <rect x="156" y="70" width="36" height="110" rx="14" fill="#94a3b8" stroke="#e2e8f0" stroke-width="6" />
  <rect x="320" y="70" width="36" height="110" rx="14" fill="#94a3b8" stroke="#e2e8f0" stroke-width="6" />

  <!-- Cargo Crate on Forks -->
  <rect x="176" y="75" width="160" height="95" rx="18" fill="url(#crate)" stroke="#fef3c7" stroke-width="8" />
  <path d="M256 75v95M176 122h160" stroke="#fef3c7" stroke-width="8" />
  <rect x="236" y="102" width="40" height="40" rx="6" fill="#451a03" />
  <path d="M246 112v20M256 112v20M266 112v20" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

  <!-- Rubber Wheels -->
  <rect x="96" y="200" width="36" height="85" rx="14" fill="#090d14" stroke="#475569" stroke-width="6" />
  <rect x="380" y="200" width="36" height="85" rx="14" fill="#090d14" stroke="#475569" stroke-width="6" />
  <rect x="106" y="320" width="36" height="85" rx="14" fill="#090d14" stroke="#475569" stroke-width="6" />
  <rect x="370" y="320" width="36" height="85" rx="14" fill="#090d14" stroke="#475569" stroke-width="6" />

  <!-- Main Chassis -->
  <rect x="126" y="165" width="260" height="260" rx="55" fill="url(#chassis)" stroke="#7dd3fc" stroke-width="12" />

  <!-- Rear Counterweight Bumper (Amber) -->
  <path d="M146 365h220v30a25 25 0 0 1-25 25h-170a25 25 0 0 1-25-25v-30Z" fill="#f59e0b" />

  <!-- Roll Cage Cab -->
  <rect x="166" y="205" width="180" height="145" rx="35" fill="#0f172a" stroke="#38bdf8" stroke-width="10" />

  <!-- Operator Beacon / Glow -->
  <circle cx="256" cy="275" r="42" fill="url(#beacon)" />
  <circle cx="256" cy="275" r="22" fill="#38bdf8" />
  <circle cx="256" cy="275" r="10" fill="#e0f2fe" />
</svg>
